name: Protocol tests
on:
  push:
  pull_request:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run parser tests
        run: make -C tests test
      - name: Verify FreeRDP patch syntax
        run: python3 scripts/check-patches.py

      - name: Validate experimental build script syntax
        run: bash -n scripts/build-freerdp-3ds.sh
