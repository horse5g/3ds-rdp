# Experimental port probe: do not confuse with working FreeRDP support.
name: FreeRDP ARM11 feasibility
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      phase:
        description: Attempt CMake configure only or full compile
        type: choice
        options:
          - configure
          - build
        default: configure
jobs:
  explore:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Install 3DS cryptography libraries
        run: |
          # devkitpro/devkitarm is Debian-based and provides dkp-pacman,
          # not the plain pacman command.
          if test -r "$DEVKITPRO/portlibs/3ds/include/mbedtls/ssl.h"; then
            echo "3DS Mbed TLS already installed"
          else
            dkp-pacman -Syu --noconfirm --needed 3ds-mbedtls 3ds-zlib
          fi
      - name: Configure / compile FreeRDP (experimental)
        id: port
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-freerdp-3ds.sh '${{ inputs.phase || 'build' }}' 2>&1 | tee freerdp-port.log
      - name: Report upstream port result
        if: always()
        shell: bash
        run: |
          echo '## Experimental FreeRDP ARM11 port' >> "$GITHUB_STEP_SUMMARY"
          echo 'Configure/compile outcome: **${{ steps.port.outcome }}**. FreeRDP is not linked into the O3DS application.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freerdp-arm11-diagnostics
          path: |
            freerdp-port.log
            build/freerdp-3ds/CMakeFiles/CMakeConfigureLog.yaml
            build/freerdp-3ds/CMakeFiles/CMakeError.log
            build/freerdp-3ds/CMakeCache.txt

      - name: Inventory compiled ARM11 archives
        if: always()
        shell: bash
        run: |
          if test -d build/freerdp-3ds; then
            find build/freerdp-3ds -type f -name '*.a' -print
          fi
      - name: Upload compiled WinPR static archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winpr-arm11-static-experimental
          if-no-files-found: ignore
          path: |
            build/freerdp-3ds/winpr/**/*.a
