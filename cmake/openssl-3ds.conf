# OpenSSL 3.5 target for Nintendo 3DS / Horizon OS.
#
# Included in an ignored, pinned upstream source checkout by
# scripts/build-openssl-3ds.sh.  This is an experimental build target:
# compiling libcrypto and libssl does not establish correct runtime RNG,
# clock, certificate trust, or TLS interoperability.
#
# The original 3DS ARM11 has no NEON; no-asm is selected by the build
# script until ARM11-specific assembly can be audited.
my %targets = (
    "3ds-armv6k" => {
        inherit_from => [ "gcc" ],
        CFLAGS => "-Os",
        cflags => "-march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft "
                . "-ffunction-sections -fdata-sections",
        cppflags => "-D__3DS__",
        bn_ops => "BN_LLONG",
        thread_scheme => "pthreads",
        sys_id => "HORIZON",
    },
);
